<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20">
  <defs>
    <linearGradient id="lineL" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="100" y1="10" x2="385" y2="10" stroke="url(#lineL)" stroke-width="1">
    <animate attributeName="x1" values="200;100;200" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="415" y1="10" x2="700" y2="10" stroke="url(#lineR)" stroke-width="1">
    <animate attributeName="x2" values="600;700;600" dur="3s" repeatCount="indefinite"/>
  </line>
  <polygon points="400,3 407,10 400,17 393,10" fill="#a855f7" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="390" cy="10" r="1.5" fill="#00f0ff" opacity="0.6">
    <animate attributeName="cx" values="390;350;390" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="10" r="1.5" fill="#00f0ff" opacity="0.6">
    <animate attributeName="cx" values="410;450;410" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>